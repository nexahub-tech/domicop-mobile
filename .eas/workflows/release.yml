name: Release

# Fires automatically when a version tag is pushed (e.g. `git tag v6.0.1 && git push origin v6.0.1`).
# Can also be run on demand: `eas workflow:run .eas/workflows/release.yml -F platform=android`
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Which platforms to build and submit
        options:
          - all
          - android
          - ios
        default: all
        required: false

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  check_version:
    name: Check tag matches app version
    # Always runs, rather than being gated by `if`. A skipped job skips the
    # jobs that need it, which would silently disable the builds on a
    # workflow_dispatch run — so the tag test lives inside the script instead.
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Compare the git tag to expo.version
        run: |
          set -euo pipefail

          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "Not a tag run — nothing to compare."
            exit 0
          fi

          TAG="${{ github.ref_name }}"
          # Read the resolved config rather than grepping the file, so this
          # keeps working if `version` ever stops being a plain literal.
          VERSION="$(npx --yes expo config --type public --json | node -e '
            let raw = "";
            process.stdin.on("data", (c) => (raw += c));
            process.stdin.on("end", () => {
              const cfg = JSON.parse(raw);
              process.stdout.write(String(cfg.version ?? ""));
            });
          ')"

          echo "tag:              $TAG"
          echo "expo.version:     $VERSION"

          if [ "$TAG" != "v$VERSION" ]; then
            echo ""
            echo "Tag \"$TAG\" does not match version \"$VERSION\" in app.config.js."
            echo ""
            echo "EAS auto-increments versionCode/buildNumber, but NOT the version"
            echo "string — so this release would ship to the stores labelled"
            echo "$VERSION while being tagged $TAG."
            echo ""
            echo "Set expo.version to ${TAG#v} in app.config.js, or tag v$VERSION."
            exit 1
          fi

          echo "Tag and version agree."

          # --- the version must also be newer than everything already shipped ---
          #
          # The check above only proves the tag and the config agree. Releasing
          # a version that has already shipped would still pass it, build with
          # a bumped build number, and only be rejected by the store at submit
          # time — after the build minutes are gone.
          #
          # EAS build history is the source of truth here, not git tags. Tags
          # cannot answer this: a force-retag of an existing tag is
          # indistinguishable from a new one from inside the job, and
          # `eas/checkout` is not documented to fetch tags at all.
          SHIPPED="$(npx --yes eas-cli@latest build:list \
            --profile production --status finished --limit 50 \
            --json --non-interactive 2>/dev/null | node -e '
              let raw = "";
              process.stdin.on("data", (c) => (raw += c));
              process.stdin.on("end", () => {
                let builds = [];
                try { builds = JSON.parse(raw); } catch { process.exit(0); }
                const seen = [...new Set(builds.map((b) => b.appVersion).filter(Boolean))];
                process.stdout.write(seen.join("\n"));
              });
            ' || true)"

          if [ -z "$SHIPPED" ]; then
            # Not proven safe, just unverifiable. Say which it is rather than
            # letting a silent pass look like a green check.
            echo "Could not read EAS build history — skipping the newer-than check."
            exit 0
          fi

          echo "already shipped:  $(echo "$SHIPPED" | tr '\n' ' ')"

          if echo "$SHIPPED" | grep -qFx "$VERSION"; then
            echo ""
            echo "Version $VERSION has already been built and released."
            echo "The stores reject a duplicate version string, so this would"
            echo "fail at submit time. Bump expo.version and retag."
            exit 1
          fi

          # sort -V is version-aware, so 6.0.10 correctly outranks 6.0.2.
          HIGHEST="$(printf '%s\n' "$SHIPPED" | sort -V | tail -1)"
          if [ "$(printf '%s\n%s\n' "$VERSION" "$HIGHEST" | sort -V | head -1)" = "$VERSION" ]; then
            echo ""
            echo "Version $VERSION is older than $HIGHEST, which has already shipped."
            echo "Releases must move forward — the stores will not accept a"
            echo "version below one already published."
            exit 1
          fi

          echo "Version $VERSION is newer than everything shipped so far."

  build_android:
    name: Build Android
    type: build
    # Skipped builds skip their dependent submit job too.
    needs: [check_version]
    if: ${{ (inputs.platform || 'all') != 'ios' }}
    params:
      platform: android
      profile: production
      message: ${{ github.ref_name }}

  build_ios:
    name: Build iOS
    type: build
    needs: [check_version]
    if: ${{ (inputs.platform || 'all') != 'android' }}
    params:
      platform: ios
      profile: production
      message: ${{ github.ref_name }}

  submit_android:
    name: Submit to Google Play
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production

  submit_ios:
    name: Submit to App Store Connect
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
